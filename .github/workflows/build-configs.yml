name: 'Build configs'
on:
  workflow_dispatch:
  schedule:
    - cron: '50 14 * * *'
permissions:
  actions: read
  contents: read
jobs:
  build-linux-ogc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Aineias
          # add more machine targets here
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          build-mount-path: '/nix'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Use cachix
        uses: cachix/cachix-action@v17
        with:
          name: vzstless-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build config ${{ matrix.target }}
        run: |
          nix build .#nixosConfigurations.${{ matrix.target }}.config.system.build.toplevel --print-out-paths
